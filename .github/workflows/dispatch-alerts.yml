name: Dispatch due Telegram alerts

on:
  schedule:
    - cron: "2-57/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-alert-dispatch
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      APP_BASE_URL: ${{ secrets.APP_BASE_URL }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - name: Trigger protected dispatcher
        shell: bash
        run: |
          if [[ -z "$APP_BASE_URL" || -z "$CRON_SECRET" ]]; then
            echo "Configure APP_BASE_URL and CRON_SECRET as repository Actions secrets."
            exit 1
          fi
          curl --fail-with-body --show-error --silent \
            --retry 2 --retry-all-errors --max-time 180 \
            --header "Authorization: Bearer $CRON_SECRET" \
            "${APP_BASE_URL%/}/operations/cron/dispatch-alerts"
