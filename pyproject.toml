[project]
name = "job-matcher"
version = "0.1.0"
description = "Explainable graduate job matching and seven-day Telegram alerts."
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
  "Authlib>=1.7,<2",
  "Flask>=3.1,<4",
  "Flask-Login>=0.6.3,<1",
  "Flask-Limiter>=3.12,<5",
  "Flask-Migrate>=4.1,<5",
  "Flask-SQLAlchemy>=3.1,<4",
  "Flask-WTF>=1.2.2,<2",
  "beautifulsoup4>=4.13,<5",
  "bleach>=6.2,<7",
  "email-validator>=2.2,<3",
  "odfpy>=1.4.1,<2",
  "phonenumbers>=9,<10",
  "Pillow>=11,<13",
  "psycopg[binary]>=3.2,<4",
  "pypdf>=5,<7",
  "python-docx>=1.1,<2",
  "python-dotenv>=1.1,<2",
  "requests>=2.32,<3",
  "redis>=6.2,<9",
  "striprtf>=0.0.29,<1",
  "tzdata>=2025.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.12,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.vercel]
entrypoint = "run:app"
